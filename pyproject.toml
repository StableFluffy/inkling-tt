[build-system]
requires = ["setuptools>=77.0.3,<81.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkling-tt"
version = "0.1.0"
description = "Inkling-2-Mini (thinkingmachines) on one Tenstorrent Blackhole p150a with TTNN"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.11"
# torch, ttnn and transformers come from the pinned tt-metal Python environment
# (tt-metal 79951bd44b7484a136b3619e0d81f26baa8a1936: torch 2.11.0+cpu, transformers 5.12.1).
dependencies = [
    "safetensors",
]
keywords = ["tenstorrent", "blackhole", "p150a", "tt-metal", "ttnn", "moe", "inkling"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
serve = [
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
]
# vLLM 0.31.0 must be the VLLM_TARGET_DEVICE=empty build and vllm-tt-plugin the
# compat/vllm-0.31.0 line; serve/install_vllm_venv.sh installs both from source.
# The PyPI vllm wheel targets CUDA and would replace the tt-metal torch, so it is not listed here.
vllm = [
    "numba==0.61.2",
]

[project.urls]
Source = "https://github.com/StableFluffy/inkling-tt"
"Base model" = "https://huggingface.co/thinkingmachines/Inkling-2-Mini"

[tool.setuptools]
packages = ["inkling_tt"]

[tool.setuptools.package-data]
inkling_tt = ["kernels/*/*.cpp", "kernels/*/*.h", "kernels/experts/*.py"]

[tool.ruff]
target-version = "py310"
line-length = 120
# Python sources only: Markdown code blocks in docs/ are prose examples, not formatted code.
include = ["*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E731",   # small lambdas bound to names are the house style for device upload helpers
    "E741",   # l, I, O follow the model's math notation (layer index, intermediate width)
    "B905",   # zip() lengths are matched by construction; strict=True would add a runtime check
    "RUF001", # intentional Unicode in strings and comments (x, mu, ...)
    "RUF002",
    "RUF003",
    "RUF005", # list concatenation in shape and argument building; unpacking is no clearer
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks and kernel checks build closures in a loop and time them in the same iteration.
"tests/*.py" = ["B023"]
# Class attributes read by transformers and vllm-tt-plugin, not mutable defaults.
"serve/vllm_inkling/*.py" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["inkling_tt", "serve"]

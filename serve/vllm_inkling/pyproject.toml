[build-system]
requires = ["setuptools>=77.0.3,<81.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkling-vllm-tt"
version = "0.1.0"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
inkling_config = "inkling_vllm_config:register"

[tool.setuptools]
py-modules = ["inkling_vllm_config", "inkling_vllm_adapter"]
